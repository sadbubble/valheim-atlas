# Continuous integration: the pre-push gate (npm run check), a production build within the
# SPEC §8 budget, and the Playwright e2e suite in Chromium (software WebGL). docs/RELEASE.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests, data validation
        run: npm run check

      - name: Build and check the bundle budget
        run: npm run budget -- --build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (dev server + production build under a sub-path)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Keep Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
